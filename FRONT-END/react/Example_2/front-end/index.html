<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--favicon-->
  <link rel="shortcut icon" href="./app/assets/img/logos/logo.png" type="image/png">
  <title>Aplicación React con Bootstrap</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <!--My syles-->
  <link rel="stylesheet" href="./app/assets/css/register.css">
</head>
<body class="bg-body">
  <div id="root"></div>

  <!-- React y dependencias desde CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Componentes individuales -->
  <script type="text/babel" src="./app/contexts/ThemeContext.js"></script>
  <script type="text/babel" src="./app/components/Navbar.js"></script>
  <script type="text/babel" src="./app/components/Sidebar.js"></script>
  <script type="text/babel" src="./app/components/Footer.js"></script>
  <script type="text/babel" src="./app/components/ToastContainer.js"></script>
  <script type="text/babel" src="./app/components/RegisterForm.js"></script>
  <script type="text/babel" src="./app/components/App.js"></script>

  <!-- Renderizado inicial -->
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
